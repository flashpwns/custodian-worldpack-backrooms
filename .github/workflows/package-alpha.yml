name: Package Yellow Beast Alpha

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/**"
      - "desktop/**"
      - "profiles/**"
      - "scenarios/**"
      - "manifest.json"
      - "package*.json"
      - ".github/workflows/package-alpha.yml"

jobs:
  package:
    strategy:
      # Each platform's package is independent evidence; one failing must not cancel the other.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The macOS desktop package ships its own pinned local dialogue runtime (llama.cpp + model). CI obtains
      # it from the exact URLs in tools/local-runtime-pin.json; every byte is verified against the pinned
      # SHA-256 before it is used. Platforms without a pinned runtime package deterministic dialogue only.
      - name: Restore pinned local dialogue runtime
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: vendor
          key: local-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/local-runtime-pin.json') }}
      - name: Fetch pinned local dialogue runtime
        if: runner.os == 'macOS'
        run: node tools/fetch-runtime-resources.js
      - run: npm run build:alpha
      - run: npm run verify:alpha
      - run: npm run desktop:build
      - run: npm run desktop:package -- --mac zip
        if: runner.os == 'macOS'
      - run: npm run desktop:package -- --win zip
        if: runner.os == 'Windows'
      - run: npm run desktop:verify
      - name: Retain validated macOS desktop alpha
        if: runner.os == 'macOS' && success()
        uses: actions/upload-artifact@v4
        with:
          name: yellow-beast-desktop-macos-arm64
          path: dist/desktop/Yellow Beast-*-arm64-mac.zip
          if-no-files-found: error
          retention-days: 14
      - name: Retain validated Windows desktop alpha
        if: runner.os == 'Windows' && success()
        uses: actions/upload-artifact@v4
        with:
          name: yellow-beast-desktop-windows
          path: dist/desktop/Yellow Beast-*-win.zip
          if-no-files-found: error
          retention-days: 14
