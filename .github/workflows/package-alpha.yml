name: Package Yellow Beast Alpha

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/**"
      - "desktop/**"
      - "profiles/**"
      - "scenarios/**"
      - "manifest.json"
      - "package*.json"
      - ".github/workflows/package-alpha.yml"

jobs:
  package:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:alpha
      - run: npm run verify:alpha
      - run: npm run desktop:build
      - run: npm run desktop:package -- --mac zip
        if: runner.os == 'macOS'
      - run: npm run desktop:package -- --win zip
        if: runner.os == 'Windows'
      - run: npm run desktop:verify
      - name: Retain validated macOS desktop alpha
        if: runner.os == 'macOS' && success()
        uses: actions/upload-artifact@v4
        with:
          name: yellow-beast-0.13.0-alpha-macos-arm64
          path: dist/desktop/Yellow Beast-0.13.0-alpha-arm64-mac.zip
          if-no-files-found: error
          retention-days: 14
      - name: Retain validated Windows desktop alpha
        if: runner.os == 'Windows' && success()
        uses: actions/upload-artifact@v4
        with:
          name: yellow-beast-0.13.0-alpha-windows
          path: dist/desktop/Yellow Beast-0.13.0-alpha-win.zip
          if-no-files-found: error
          retention-days: 14
